[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Arabic pages are real files in /ar/; everything else under /ar/ (css, js, images, other files) comes from the site root
[[redirects]]
  from = "/ar/*"
  to = "/:splat"
  status = 200

# Malay pages work the same way under /ms/
[[redirects]]
  from = "/ms/*"
  to = "/:splat"
  status = 200

# digital business cards: contact files open in the phone's contacts app
[[headers]]
  for = "/card/*"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/card/*/contact.vcf"
  [headers.values]
    Content-Type = "text/vcard; charset=utf-8"
