[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Arabic pages are real files in /ar/; everything else under /ar/ (css, js, images, other files) comes from the site root
[[redirects]]
  from = "/ar/*"
  to = "/:splat"
  status = 200
