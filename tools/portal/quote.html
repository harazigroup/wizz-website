:root{--ink:#1F2328;--muted:#5d636b;--line:#e3e5e8;--red:#E01B22;--bg:#F3F5F7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.bar{max-width:860px;margin:20px auto 0;padding:0 16px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:8px;padding:9px 14px;font:600 14px inherit;cursor:pointer;text-decoration:none}
.btn.solid{background:var(--ink);color:#fff}.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.doc{max-width:860px;margin:14px auto 40px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:44px 48px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:2px solid var(--ink);padding-bottom:18px}
.hd img{height:44px}
.co{text-align:end;font-size:12.5px;color:var(--muted);line-height:1.5}.co b{color:var(--ink);font-size:13px;letter-spacing:.04em}
h1{font-size:30px;margin:26px 0 4px;letter-spacing:-.01em}
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0 26px}
.meta div{background:var(--bg);border-radius:8px;padding:10px 12px}.meta small{display:block;color:var(--muted);font-size:12px}.meta b{font-size:14px}
table{width:100%;border-collapse:collapse;margin:6px 0}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:start;border-bottom:1px solid var(--line);padding:8px 6px}
td{padding:12px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.num{text-align:end;white-space:nowrap}
.tot td{border:0;font-size:18px;font-weight:700;padding-top:16px}
h2{font-size:16px;margin:28px 0 8px}
ul,ol{margin:0;padding-inline-start:20px}li{margin:4px 0}
.note{background:#fff7e6;border:1px solid #f3dcae;border-radius:8px;padding:12px 14px;margin-top:14px;white-space:pre-wrap}
.terms{font-size:13.5px;color:#33383f}
.accept{margin-top:28px;border:2px solid var(--ink);border-radius:10px;padding:18px 20px}
.accept input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;margin:8px 0}
.accept label{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.ok{background:#e4f5ea;border:1px solid #b9e2c7;border-radius:10px;padding:16px 18px;margin-top:28px}
.ft{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);text-align:center}
.msg{max-width:860px;margin:60px auto;padding:0 16px;text-align:center}
[dir=rtl] .co{text-align:start}
@media (max-width:640px){.doc{padding:24px 18px;border-radius:0}.meta{grid-template-columns:1fr 1fr}.hd{flex-direction:column}.co{text-align:start}}
@media print{body{background:#fff}.bar,.accept,.noprint{display:none!important}.doc{border:0;margin:0;padding:0;max-width:none}@page{size:A4;margin:16mm}}
</style>
